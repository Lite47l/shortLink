services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: url-shortener
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      - STORAGE_TYPE=${STORAGE_TYPE:-postgres}
      - SERVER_PORT=${SERVER_PORT:-8080}
      - BASE_URL=${BASE_URL:-http://localhost:8080/}
      - DATABASE_DSN=postgres://${POSTGRES_USER:-short_user}:${POSTGRES_PASSWORD:-short_pass}@db:5432/${POSTGRES_DB:-url_shortener}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - shortener-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/shorten"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  db:
    image: postgres:15-alpine
    container_name: url-shortener-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-short_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-short_pass}
      POSTGRES_DB: ${POSTGRES_DB:-url_shortener}
    ports:
      - "5432:5432"
    volumes:
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-short_user} -d ${POSTGRES_DB:-url_shortener}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - shortener-network


volumes:
  pgdata:
    driver: local
    name: url-shortener-pgdata


networks:
  shortener-network:
    driver: bridge
    name: url-shortener-network